name: Premium checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: forma_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: forma_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U forma_test -d forma_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://forma_test:test-only-password@127.0.0.1:5432/forma_test_ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
